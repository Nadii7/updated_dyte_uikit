version: 0.9.5
name: dyte_uikit
homepage: https://docs.dyte.io/flutter
description: Dyte's UI SDK to integrate video-audio to your app

environment:
  sdk: ">=2.18.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  get_it: ^8.0.3
  dyte_core: 0.4.5
  dyte_icons: 0.0.3
  file_picker: ^9.0.2
  flutter_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.15
  flutter_lints: ^5.0.0

flutter:
  assets:
    - pubspec.yaml
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
