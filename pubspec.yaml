name: dyte_uikit
description: Dyte's UI SDK to integrate video-audio to your app
version: 0.9.5
homepage: https://docs.dyte.io/flutter
environment:
  sdk: ">=2.18.0 <4.0.0"
  flutter: ">=1.17.0"
dependencies:
  flutter:
    sdk: flutter
  dyte_core: 0.4.5
  get_it: ^7.2.0
  flutter_riverpod: ^2.1.3
  file_picker: ^9.0.2
  dyte_icons: 0.0.3
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.3.3
flutter:
  assets:
    - pubspec.yaml
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
